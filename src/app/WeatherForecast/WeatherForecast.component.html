<h2>Weather Forecast</h2>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Temperature C</th>
      <th>Temperature F</th>
      <th>Summary</th>
    </tr>
  </thead>

  <tbody>
    @for (item of values; track $index) {
      <tr>
        <td>{{ item.date }}</td>
        <td>{{ item.temperatureC }}</td>
        <td>{{ item.temperatureF }}</td>
        <td>{{ item.summary }}</td>
      </tr>
    }
  </tbody>
</table>

<hr>
